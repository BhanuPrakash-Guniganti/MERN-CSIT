<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT REGISTRATION FORM</title>
</head>

<body>
      <center>
        <form>
            <div>
            <label for="Name"> Full Name:</label>
            <input type="text" name="Name" placeholder="Enter your Full Name" minlength="3" maxlength="30" required>
           <br> <br>

            <label for="Username"> User Name:</label>
            <input type="text" name="Username" placeholder="Enter your User Name" minlength="5" maxlength="15" required>
            <br> <br>

            <label for="Email"> Email:</label>
            <input type="email" name="Email" placeholder="Enter your Email" required>
            <br> <br>

            <label for="Password"> Password:</label>
            <input type="password" name="Password" placeholder="Enter your Password" minlength="8" maxlength="20"
                required>
            <br> <br>

            <label for="tel">Phone Number:</label>
            <input type="tel" name="tel" placeholder="Enter your Phone Number">
            <br> <br>

            <label for="date">DOB</label>
            <input type="date" name="date">
            <br> <br>

            <label for="gender">Gender :</label>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <input type="radio" name="gender" value="other"> Other
            <br> <br>

            <label for="Skills">Skills : </label>
            <input type="checkbox" name="Skills" value="HTML"> HTML
            <input type="checkbox" name="Skills" value="CSS"> CSS
            <input type="checkbox" name="Skills" value="JavaScript"> JavaScript
            <input type="checkbox" name="Skills" value="Python"> Python
            <br> <br>


            <label for="department">Department :</label>
            <select name="department">
                <option value="csit">CSIT</option>
                <option value="cse">CSE</option>
                <option value="ece">ECE</option>
                <option value="eee">EEE</option>
                <option value="mech">MECH</option>
                <option value="civil">Civil</option>
            </select>
            <br> <br>


            <label for="address">Address :</label> <br>
            <textarea id="address" name="address" placeholder="Enter your Address" rows="4" cols="30" minlength="10"
                maxlength="100" required></textarea>
            <br> <br>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>

             </div>
        </form>
    </center>
</body>

</html>
